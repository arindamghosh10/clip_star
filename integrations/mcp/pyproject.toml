[project]
name = "clipstar-mcp"
version = "1.0.0"
description = "MCP server for clip_star: lets AI assistants review clips, schedule posts and read results through clip_star's API."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipstar-mcp = "clipstar_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipstar_mcp*"]
